
services:
  api:
    build: .
    environment:
      PORT: "8080"
      DATABASE_PATH: /data/app.sqlite3
      GATEWAY_TOKEN: "${GATEWAY_TOKEN:-}"
      RANGER_TOKEN: "${RANGER_TOKEN:-}"
      ECO_TOKEN: "${ECO_TOKEN:-}"
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - app-data:/data

volumes:
  app-data:
